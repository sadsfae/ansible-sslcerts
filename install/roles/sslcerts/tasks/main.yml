---
# set fact for ansible_hostname
- name: Set FQDN Custom Facts
  set_fact:
    www_hostname: "{{ ansible_nodename }}"

# Optional wildcard seeding (enabled with use_seed_file_if_absent).
# If a host lacks a host-specific certificate/key, seed it on the control
# node from the wildcard files named by wildcard_cert_file/wildcard_key_file.
# Explicit per-host files are never overwritten.
- name: Check local host certificate
  ansible.builtin.stat:
    path: "{{ role_path }}/files/{{ www_hostname }}.pem"
  delegate_to: localhost
  register: host_cert_pem
  when: use_seed_file_if_absent | bool

- name: Check local host key
  ansible.builtin.stat:
    path: "{{ role_path }}/files/{{ www_hostname }}.key"
  delegate_to: localhost
  register: host_cert_key
  when: use_seed_file_if_absent | bool

- name: Seed local host certificate from wildcard certificate
  ansible.builtin.copy:
    src: "{{ role_path }}/files/{{ wildcard_cert_file }}"
    dest: "{{ role_path }}/files/{{ www_hostname }}.pem"
    mode: '0600'
  delegate_to: localhost
  when:
    - use_seed_file_if_absent | bool
    - not host_cert_pem.stat.exists

- name: Seed local host key from wildcard key
  ansible.builtin.copy:
    src: "{{ role_path }}/files/{{ wildcard_key_file }}"
    dest: "{{ role_path }}/files/{{ www_hostname }}.key"
    mode: '0600'
  delegate_to: localhost
  when:
    - use_seed_file_if_absent | bool
    - not host_cert_key.stat.exists

# Apache Webserver
- name: Replacing Apache Certificates
  ansible.builtin.copy:
    src: "{{ www_hostname }}.pem"
    dest: "{{ apache_cert_path }}"
    owner: "{{ sslcerts_owner | default('root') }}"
    group: "{{ sslcerts_group | default('root') }}"
    backup: true
    mode: "{{ sslcerts_mode | default('0600') }}"
  when: "'apache' in group_names"

- name: Replacing Apache Keys
  ansible.builtin.copy:
    src: "{{ www_hostname }}.key"
    dest: "{{ apache_key_path }}"
    owner: "{{ sslcerts_owner | default('root') }}"
    group: "{{ sslcerts_group | default('root') }}"
    backup: true
    mode: "{{ sslcerts_mode | default('0600') }}"
  notify:
    - Reload Apache
    - Reload ApacheSysV
  when: "'apache' in group_names"

# Nginx Webserver
- name: Replacing Nginx Certificates
  ansible.builtin.copy:
    src: "{{ www_hostname }}.pem"
    dest: "{{ nginx_cert_path }}"
    owner: "{{ sslcerts_owner | default('root') }}"
    group: "{{ sslcerts_group | default('root') }}"
    backup: true
    mode: "{{ sslcerts_mode | default('0600') }}"
  when: "'nginx' in group_names"

- name: Replacing Nginx Keys
  ansible.builtin.copy:
    src: "{{ www_hostname }}.key"
    dest: "{{ nginx_key_path }}"
    owner: "{{ sslcerts_owner | default('root') }}"
    group: "{{ sslcerts_group | default('root') }}"
    backup: true
    mode: "{{ sslcerts_mode | default('0600') }}"
  notify:
    - Reload Nginx
    - Reload NginxSysV
  when: "'nginx' in group_names"
