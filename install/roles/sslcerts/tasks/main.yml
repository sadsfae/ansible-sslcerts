---
# set fact for ansible_hostname
- name: Set FQDN Custom Facts
  set_fact:
    www_hostname: "{{ ansible_nodename }}"

# Optional wildcard fallback (enabled with use_seed_file_if_absent, defined
# in this role's defaults/main.yml).  Per-host certificate/key files are
# named after the system hostname (www_hostname = ansible_nodename) and
# live in this role's files/ directory.  When enabled and a per-host file
# is absent, the wildcard files named by wildcard_cert_file/wildcard_key_file
# are used directly as the copy source; nothing is written into files/.
# Per-host files always take precedence, and a host that has only one of the
# pair fails loudly rather than deploying a mismatched certificate.
- name: Check local host certificate
  ansible.builtin.stat:
    path: "{{ role_path }}/files/{{ www_hostname }}.pem"
  delegate_to: localhost
  register: host_cert_pem
  when:
    - use_seed_file_if_absent | default(false) | bool
    - "'apache' in group_names or 'nginx' in group_names"

- name: Check local host key
  ansible.builtin.stat:
    path: "{{ role_path }}/files/{{ www_hostname }}.key"
  delegate_to: localhost
  register: host_cert_key
  when:
    - use_seed_file_if_absent | default(false) | bool
    - "'apache' in group_names or 'nginx' in group_names"

- name: Fail on half a certificate/key pair
  ansible.builtin.fail:
    msg: >-
      {{ www_hostname }} has only one of
      {{ role_path }}/files/{{ www_hostname }}.{pem,key};
      with use_seed_file_if_absent enabled, provide both files or remove both.
  when:
    - use_seed_file_if_absent | default(false) | bool
    - "'apache' in group_names or 'nginx' in group_names"
    - (host_cert_pem.stat.exists | default(false) | bool) != (host_cert_key.stat.exists | default(false) | bool)

# The copy tasks use the per-host file when it exists (or when wildcard
# fallback is off, preserving the original loud failure on a missing file);
# otherwise the wildcard file is copied directly to the per-host destination
# name.  Re-running picks up wildcard renewals automatically.
# Apache Webserver
- name: Replacing Apache Certificates
  ansible.builtin.copy:
    src: "{{ (www_hostname ~ '.pem') if ((not (use_seed_file_if_absent | default(false) | bool)) or host_cert_pem.stat.exists) else wildcard_cert_file }}"
    dest: "{{ apache_cert_path }}/{{ www_hostname }}.pem"
    owner: "{{ sslcerts_owner | default('root') }}"
    group: "{{ sslcerts_group | default('root') }}"
    backup: true
    mode: "{{ sslcerts_mode | default('0600') }}"
  when: "'apache' in group_names"

- name: Replacing Apache Keys
  ansible.builtin.copy:
    src: "{{ (www_hostname ~ '.key') if ((not (use_seed_file_if_absent | default(false) | bool)) or host_cert_key.stat.exists) else wildcard_key_file }}"
    dest: "{{ apache_key_path }}/{{ www_hostname }}.key"
    owner: "{{ sslcerts_owner | default('root') }}"
    group: "{{ sslcerts_group | default('root') }}"
    backup: true
    mode: "{{ sslcerts_mode | default('0600') }}"
  notify:
    - Reload Apache
    - Reload ApacheSysV
  when: "'apache' in group_names"

# Nginx Webserver
- name: Replacing Nginx Certificates
  ansible.builtin.copy:
    src: "{{ (www_hostname ~ '.pem') if ((not (use_seed_file_if_absent | default(false) | bool)) or host_cert_pem.stat.exists) else wildcard_cert_file }}"
    dest: "{{ nginx_cert_path }}/{{ www_hostname }}.pem"
    owner: "{{ sslcerts_owner | default('root') }}"
    group: "{{ sslcerts_group | default('root') }}"
    backup: true
    mode: "{{ sslcerts_mode | default('0600') }}"
  when: "'nginx' in group_names"

- name: Replacing Nginx Keys
  ansible.builtin.copy:
    src: "{{ (www_hostname ~ '.key') if ((not (use_seed_file_if_absent | default(false) | bool)) or host_cert_key.stat.exists) else wildcard_key_file }}"
    dest: "{{ nginx_key_path }}/{{ www_hostname }}.key"
    owner: "{{ sslcerts_owner | default('root') }}"
    group: "{{ sslcerts_group | default('root') }}"
    backup: true
    mode: "{{ sslcerts_mode | default('0600') }}"
  notify:
    - Reload Nginx
    - Reload Nginx Custom
    - Reload NginxSysV
  when: "'nginx' in group_names"
