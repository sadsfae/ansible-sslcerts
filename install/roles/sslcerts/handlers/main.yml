---
- name: Reload Nginx
  ansible.builtin.service:
    name: nginx
    state: restarted
  when: not (sslcerts_nginx_reload_command | default('')) and
        ((ansible_facts['os_family'] == "RedHat") or
         (ansible_facts['os_family'] == "Debian"))

- name: Reload Nginx Custom
  # ansible.builtin.command is not shell-interpreted: the value must be a
  # single command with arguments (pipes, &&, redirects are literal args and
  # fail). Use the systemctl form shown in the README.
  ansible.builtin.command: "{{ sslcerts_nginx_reload_command | default('') }}"
  when: sslcerts_nginx_reload_command | default('')

- name: Reload Apache
  ansible.builtin.service:
    name: httpd
    state: restarted
  when: (ansible_facts['os_family'] == "RedHat") or
        (ansible_facts['os_family'] == "Debian")

- name: Reload NginxSysV
  ansible.builtin.command: /etc/rc.d/rc.nginx restart
  when: not (sslcerts_nginx_reload_command | default('')) and
        ((ansible_facts['os_family'] == "Slackware") or
         (ansible_facts['os_family'] == "FreeBSD"))

- name: Reload ApacheSysV
  ansible.builtin.command: /etc/rc.d/rc.httpd restart
  when: (ansible_facts['distribution'] == "Slackware") or
        (ansible_facts['distribution'] == "FreeBSD")
